name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ESPHome
        run: pip install esphome==2026.10.2

      - name: Prepare ESPHome secrets
        working-directory: esphome
        env:
          API_ENCRYPTION_KEY: ${{ secrets.ESPHOME_API_ENCRYPTION_KEY }}
        run: |
          if [ -z "$API_ENCRYPTION_KEY" ]; then
            API_ENCRYPTION_KEY="$(openssl rand -base64 32)"
          fi
          printf 'api_encryption_key: "%s"\n' "$API_ENCRYPTION_KEY" > secrets.yaml

      - name: Validate
        working-directory: esphome
        run: esphome config esp32-s3-ec20.yaml

      - name: Build
        working-directory: esphome
        run: esphome compile esp32-s3-ec20.yaml

      - name: Checksums
        working-directory: esphome/.esphome/build/esp32-s3-speaker/build
        run: sha256sum firmware.factory.bin firmware.ota.bin > SHA256SUMS

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            esphome/.esphome/build/esp32-s3-speaker/build/firmware.factory.bin
            esphome/.esphome/build/esp32-s3-speaker/build/firmware.ota.bin
            esphome/.esphome/build/esp32-s3-speaker/build/SHA256SUMS
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            esphome/.esphome/build/esp32-s3-speaker/build/firmware.factory.bin
            esphome/.esphome/build/esp32-s3-speaker/build/firmware.ota.bin
            esphome/.esphome/build/esp32-s3-speaker/build/SHA256SUMS
