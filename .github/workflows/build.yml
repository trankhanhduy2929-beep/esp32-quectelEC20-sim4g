name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ESPHome
        run: pip install esphome==2026.10.2

      - name: Validate
        working-directory: esphome
        run: esphome config esp32-s3-ec20.yaml

      - name: Build
        working-directory: esphome
        run: esphome compile esp32-s3-ec20.yaml

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            esphome/.esphome/build/esp32-s3-speaker/build/firmware.factory.bin
            esphome/.esphome/build/esp32-s3-speaker/build/firmware.ota.bin
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            esphome/.esphome/build/esp32-s3-speaker/build/firmware.factory.bin
            esphome/.esphome/build/esp32-s3-speaker/build/firmware.ota.bin
