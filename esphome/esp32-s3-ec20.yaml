substitutions:
  device_name: esp32-s3-speaker
  friendly_name: ESP32-S3 Speaker
  media_player_name: Loa ESP32-S3
  ap_ssid: "EC20 SIM SPEAKER ESP32"
  ap_password: "12345678"
  tts_entity: tts.edge_tts
  tts_media_player: media_player.esp32_s3_speaker_loa_esp32_s3
  firmware_version: "0.1.11"
  ec20_power_pin: GPIO18

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  includes:
    - <esp_wifi.h>

globals:
  - id: wifi_announced
    type: bool
    restore_value: false
    initial_value: "false"
  - id: wifi_offline_since
    type: uint32_t
    restore_value: false
    initial_value: "0"

external_components:
  - source:
      type: local
      path: components

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  baud_rate: 115200
  hardware_uart: UART0
  level: DEBUG

ec20:
  id: ec20_modem
  port: 9000
  at_response:
    name: "EC20 AT Response"
    id: ec20_at_response
    icon: mdi:sim
    web_server:
      sorting_group_id: group_ec20
      sorting_weight: 10
  usb_connected:
    name: "EC20 USB"
    web_server:
      sorting_group_id: group_ec20
      sorting_weight: 30
  tcp_connected:
    name: "Cầu TCP"
    web_server:
      sorting_group_id: group_ec20
      sorting_weight: 40
  reconnects:
    name: "Mở lại modem"
    web_server:
      sorting_group_id: group_ec20
      sorting_weight: 50
  gnss:
    latitude:
      name: "Vĩ độ"
      web_server:
        sorting_group_id: group_gnss
        sorting_weight: 10
    longitude:
      name: "Kinh độ"
      web_server:
        sorting_group_id: group_gnss
        sorting_weight: 20
    altitude:
      name: "Độ cao"
      web_server:
        sorting_group_id: group_gnss
        sorting_weight: 30
    speed:
      name: "Tốc độ GPS"
      web_server:
        sorting_group_id: group_gnss
        sorting_weight: 40
    satellites:
      name: "Vệ tinh"
      web_server:
        sorting_group_id: group_gnss
        sorting_weight: 50
    fix:
      name: "Trạng thái GPS"
      web_server:
        sorting_group_id: group_gnss
        sorting_weight: 60

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome

# WiFi dùng DHCP mặc định, không cấu hình manual_ip.

wifi:
  id: wifi_id
  ap:
    ssid: "${ap_ssid}"
    password: "${ap_password}"
    ap_timeout: 120s
    channel: 6
  on_connect:
    - if:
        condition:
          lambda: 'return !id(wifi_announced);'
        then:
          - lambda: 'id(wifi_announced) = true;'
          - script.execute: announce_wifi
  on_disconnect:
    - logger.log: "WiFi lost; auto-reconnect active"

interval:
  - interval: 60s
    then:
      - lambda: |-
          if (id(wifi_id).is_connected()) {
            if (id(wifi_offline_since) != 0) {
              id(wifi_offline_since) = 0;
              ESP_LOGI("wifi_watchdog", "WiFi reconnected");
            }
            return;
          }
          if (!id(wifi_id).has_sta()) {
            id(wifi_offline_since) = 0;
            return;
          }
          const uint32_t now = millis();
          if (id(wifi_offline_since) == 0) {
            id(wifi_offline_since) = now;
            ESP_LOGW("wifi_watchdog", "WiFi offline; waiting for automatic reconnect");
            return;
          }
          if (now - id(wifi_offline_since) >= 15UL * 60UL * 1000UL) {
            ESP_LOGE("wifi_watchdog", "WiFi offline >15 min; rebooting to reset WiFi");
            id(wifi_offline_since) = 0;
            App.reboot();
          }

script:
  - id: announce_wifi
    mode: single
    then:
      - wait_until:
          condition:
            api.connected:
          timeout: 30s
      - if:
          condition:
            api.connected:
          then:
            - delay: 5s
            - logger.log: "WiFi connected, announcing IP"
            - homeassistant.action:
                action: tts.speak
                data:
                  entity_id: ${tts_entity}
                  media_player_entity_id: ${tts_media_player}
                  language: vi-VN
                data_template:
                  message: !lambda 'return std::string("Kết nối WiFi thành công. Địa chỉ IP là ") + id(wifi_ip).state;'
                on_error:
                  - logger.log: "WiFi announcement TTS failed"

captive_portal:

web_server:
  port: 80
  version: 3
  css_include: ui/esp-ui.css
  js_include: ui/esp-ui.js
  sorting_groups:
    - id: group_info
      name: "Thông tin"
      sorting_weight: 10
    - id: group_ec20
      name: "EC20 / SIM"
      sorting_weight: 20
    - id: group_gnss
      name: "GNSS"
      sorting_weight: 25
    - id: group_wifi
      name: "WiFi"
      sorting_weight: 30
    - id: group_system
      name: "Hệ thống"
      sorting_weight: 40

esp32_ble_tracker:
  scan_parameters:
    interval: 320ms
    window: 30ms
    active: true

bluetooth_proxy:
  active: true
  connection_slots: 3

i2s_audio:
  i2s_lrclk_pin: GPIO16
  i2s_bclk_pin: GPIO15

speaker:
  - platform: i2s_audio
    id: i2s_out
    dac_type: external
    i2s_dout_pin: GPIO17
    channel: mono
    sample_rate: 48000
    bits_per_sample: 16bit

  - platform: mixer
    id: mixer_out
    output_speaker: i2s_out
    source_speakers:
      - id: media_mixer_in
      - id: announce_mixer_in

  - platform: resampler
    id: media_resampled
    output_speaker: media_mixer_in

  - platform: resampler
    id: announce_resampled
    output_speaker: announce_mixer_in

media_player:
  - platform: speaker
    name: "${media_player_name}"
    id: media_player_out
    media_pipeline:
      speaker: media_resampled
      num_channels: 2
      sample_rate: 48000
    announcement_pipeline:
      speaker: announce_resampled
      num_channels: 1
      sample_rate: 48000

text:
  - platform: template
    name: "WiFi SSID"
    id: wifi_ssid
    icon: mdi:wifi-cog
    optimistic: true
    restore_value: true
    mode: text
    max_length: 32
    web_server:
      sorting_group_id: group_wifi
      sorting_weight: 20

  - platform: template
    name: "WiFi Password"
    id: wifi_password
    icon: mdi:key-variant
    optimistic: true
    restore_value: false
    mode: password
    max_length: 64
    web_server:
      sorting_group_id: group_wifi
      sorting_weight: 30

button:
  - platform: template
    name: "Quét WiFi"
    id: wifi_scan_button
    icon: mdi:wifi-sync
    web_server:
      sorting_group_id: group_wifi
      sorting_weight: 15
    on_press:
      - lambda: |-
          wifi_scan_config_t scan_config{};
          scan_config.show_hidden = true;
          scan_config.scan_type = WIFI_SCAN_TYPE_ACTIVE;
          scan_config.scan_time.active.min = 100;
          scan_config.scan_time.active.max = 300;
          scan_config.coex_background_scan = true;
          esp_err_t err = esp_wifi_scan_start(&scan_config, false);
          if (err != ESP_OK) {
            ESP_LOGW("wifi_scan", "Khong bat dau duoc quet WiFi: %s", esp_err_to_name(err));
          }

  - platform: template
    name: "Kết nối WiFi"
    id: wifi_connect_button
    icon: mdi:wifi
    web_server:
      sorting_group_id: group_wifi
      sorting_weight: 40
    on_press:
      - wifi.configure:
          ssid: !lambda 'return id(wifi_ssid).state;'
          password: !lambda 'return id(wifi_password).state;'
          save: true
          timeout: 30s
          on_connect:
            - logger.log: "WiFi connected"
          on_error:
            - logger.log: "WiFi connection failed"

  - platform: factory_reset
    name: "Xóa WiFi và khởi động lại"
    id: wifi_reset_button
    web_server:
      sorting_group_id: group_wifi
      sorting_weight: 90

  - platform: restart
    name: "Khởi động lại"
    web_server:
      sorting_group_id: group_system
      sorting_weight: 90

  - platform: template
    name: "Reset EC20"
    id: ec20_reset_button
    icon: mdi:restart-alert
    web_server:
      sorting_group_id: group_ec20
      sorting_weight: 10
    on_press:
      - logger.log: "Resetting EC20 power"
      - switch.turn_off: ec20_power_switch
      - delay: 5s
      - switch.turn_on: ec20_power_switch

  - platform: template
    name: "EC20 Test AT"
    id: ec20_test_at
    icon: mdi:console
    web_server:
      sorting_group_id: group_ec20
      sorting_weight: 20
    on_press:
      - lambda: 'id(ec20_modem).test_at();'

switch:
  - platform: gpio
    id: ec20_power_switch
    name: "Nguồn EC20"
    pin: ${ec20_power_pin}
    restore_mode: ALWAYS_ON
    internal: true

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO0
      mode:
        input: true
        pullup: true
      inverted: true
    id: boot_button
    internal: true
    filters:
      - delayed_on: 30ms
    on_multi_click:
      - timing:
          - ON for at least 5s
        then:
          - logger.log: "BOOT held 5s: factory reset"
          - button.press: wifi_reset_button

debug:
  update_interval: 60s

sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    icon: mdi:wifi
    update_interval: 60s
    web_server:
      sorting_group_id: group_wifi
      sorting_weight: 10

  - platform: uptime
    name: "Uptime"
    icon: mdi:timer-outline
    web_server:
      sorting_group_id: group_info
      sorting_weight: 20

  - platform: debug
    free:
      name: "Bộ nhớ trống"
      icon: mdi:memory
      unit_of_measurement: "kB"
      accuracy_decimals: 1
      filters:
        - multiply: 0.0009765625
      web_server:
        sorting_group_id: group_system
        sorting_weight: 10
    block:
      name: "Bộ nhớ block lớn nhất"
      icon: mdi:memory
      unit_of_measurement: "kB"
      accuracy_decimals: 1
      filters:
        - multiply: 0.0009765625
      web_server:
        sorting_group_id: group_system
        sorting_weight: 20

  - platform: internal_temperature
    name: "Nhiệt độ chip"
    icon: mdi:thermometer
    update_interval: 60s
    web_server:
      sorting_group_id: group_system
      sorting_weight: 30

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP"
      id: wifi_ip
      icon: mdi:ip-network
      web_server:
        sorting_group_id: group_info
        sorting_weight: 10
    ssid:
      name: "SSID"
      icon: mdi:wifi
      web_server:
        sorting_group_id: group_info
        sorting_weight: 30
    bssid:
      name: "BSSID"
      icon: mdi:access-point-network
      web_server:
        sorting_group_id: group_info
        sorting_weight: 40
    mac_address:
      name: "MAC"
      icon: mdi:identifier
      web_server:
        sorting_group_id: group_info
        sorting_weight: 50
    dns_address:
      name: "DNS"
      icon: mdi:dns
      web_server:
        sorting_group_id: group_info
        sorting_weight: 60
    scan_results:
      name: "WiFi xung quanh"
      id: wifi_scan_results
      icon: mdi:wifi-sync
      web_server:
        sorting_group_id: group_wifi
        sorting_weight: 5

  - platform: version
    name: "ESPHome Version"
    icon: mdi:package-variant
    web_server:
      sorting_group_id: group_info
      sorting_weight: 90

  - platform: template
    name: "Firmware Version"
    id: firmware_version
    icon: mdi:chip
    update_interval: 60s
    lambda: |-
      return std::string("v${firmware_version}");
    web_server:
      sorting_group_id: group_info
      sorting_weight: 1
